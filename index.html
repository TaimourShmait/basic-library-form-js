<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="./styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet"> 
</head>
<body>
    
    <div id="main-container">

        <h1 id="main-title">Library</h1>
        <hr>    
        <p>Add Books</p>
        
        <form id="add-book-form"> 

            <div id="form">

                <div class="label-input-pairs">
                    <label class="text-input-labels">Book Name</label>
                    <input type="text" id="book-name" required>
                </div>

                <div class="label-input-pairs">
                    <label class="text-input-labels">Book Author</label>
                    <input type="text" id="book-author" required>
                </div>

                <div class="label-input-pairs">
                    <label class="text-input-labels">Total Pages</label>
                    <input type="number" id="book-pages" min="10" required>
                </div>

                <div id="book-genre-container">
                    <label>Book Genre</label>
                    <div id="radio-buttons-container">
                        <label>Non-Fiction<input type="radio" name="book-genre" required value="Non-Fiction"></label>
                        <label>Fiction<input type="radio" name="book-genre" required value="Fiction"></label>
                        <label>Other<input type="radio" name="book-genre" required value="Other"></label>
                    </div>
                </div>

                <input type="submit" id="submit-form-button" value="Add">

            </div>

        </form>

        <div id="books-container">
            <h2 id="your-books-title">Your Books</h2>
            <table id="books-table">
                <thead>
                    <tr id="table-first-row">
                        <th>Name</th>
                        <th>Author</th>
                        <th>Genre</th>
                        <th>Pages</th>
                        <th>Read Status</th>
                    </tr>
                </thead>

                <tr class="placeholder-row">
                    <th>—</th>
                    <th>—</th>
                    <th>—</th>
                    <th>—</th>
                    <th>—</th>
                </tr>

            </table>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
